<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lash Marii & Lash Marii Boutique</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #fff4f6;
      --card-bg: #ffffff;
      --primary: #e63974;
      --primary-hover: #c82a60;
      --text-dark: #3a1c22;
      --border-color: #f7d6e0;
      --subtext: #786267;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 20px 15px 120px 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-header {
      text-align: center;
      padding: 20px 0 10px 0;
    }

    .logo-container {
      width: 150px;
      height: 150px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #f7d6e0, #e63974);
      box-shadow: 0 6px 20px rgba(230, 57, 116, 0.2);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .welcome-text {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .brand-desc {
      font-size: 0.95rem;
      color: var(--subtext);
      line-height: 1.5;
      margin: 0 auto 18px auto;
    }

    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: #ffe6ee;
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      margin-bottom: 25px;
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #e63974, #d62862);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(230, 57, 116, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-bottom: 10px;
    }

    .sub-note {
      text-align: center;
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 25px;
    }

    .trust-footer {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      margin: 0 0 20px 0;
      text-align: left;
      font-size: 0.78rem;
      color: var(--subtext);
      line-height: 1.35;
    }

    .trust-footer-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .trust-footer-item:last-child {
      margin-bottom: 0;
    }

    .trust-footer-item strong {
      color: var(--text-dark);
    }

    .btn-secondary {
      width: 100%;
      background: #ffffff;
      color: var(--text-dark);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(230, 57, 116, 0.06);
      margin-bottom: 20px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 18px;
      color: var(--text-dark);
    }

    .card-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 22px;
      background-color: var(--primary);
      border-radius: 2px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="tel"], input[type="date"], input[type="password"] {
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 0.95rem;
      outline: none;
      color: var(--text-dark);
      background-color: #fff;
      font-family: inherit;
    }

    .service-category {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 18px 0 4px 0;
    }

    .service-category:first-of-type {
      margin-top: 5px;
    }

    .service-desc {
      font-size: 0.8rem;
      color: var(--subtext);
      line-height: 1.35;
      margin-bottom: 10px;
      background-color: #fff8f9;
      padding: 8px 12px;
      border-radius: 10px;
      border-left: 3px solid var(--primary);
    }

    .service-desc-item {
      font-size: 0.78rem;
      color: var(--subtext);
      line-height: 1.3;
      margin: -4px 0 10px 6px;
      padding-left: 8px;
      border-left: 2px solid var(--border-color);
    }

    .service-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #fff;
      user-select: none;
    }

    .service-option.selected {
      border-color: var(--primary);
      background-color: #fff8f9;
    }

    .service-info {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .service-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .service-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .service-price {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      pointer-events: none;
    }

    .total-box {
      border: 1.5px dashed var(--primary);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-dark);
      margin-top: 15px;
      background-color: #fff8f9;
      line-height: 1.6;
    }

    .total-amount {
      color: var(--primary);
      font-size: 1.15rem;
    }

    .abono-amount {
      color: #e63974;
      font-size: 1.1rem;
      font-weight: 800;
    }

    .restante-amount {
      color: #2e7d32;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .payment-box {
      background-color: #fff9fb;
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-top: 15px;
    }

    .payment-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .bank-details {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .bank-details div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #f2e6ea;
      padding: 3px 0;
    }

    .bank-details div:last-child {
      border-bottom: none;
    }

    .alert-whatsapp {
      background-color: #ffe6ee;
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.82rem;
      color: #a12c4e;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
    }

    .overbook-box {
      background-color: #fff0f3;
      border: 2px dashed #e63974;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-top: 10px;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .overbook-title {
      font-size: 1rem;
      font-weight: 800;
      color: #e63974;
      margin-bottom: 6px;
    }

    .overbook-text {
      font-size: 0.88rem;
      color: var(--text-dark);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .overbook-select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.92rem;
      color: var(--text-dark);
      background-color: #fff;
      font-weight: 600;
      outline: none;
      font-family: inherit;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .time-btn {
      background-color: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 5px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .time-btn.selected {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .placeholder-text {
      color: var(--subtext);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 10px;
      grid-column: span 3;
    }

    /* ESTILOS DE LA BOUTIQUE Y CARRUSELES DE FOTOS */
    .boutique-grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 16px;
      margin-top: 15px;
    }

    .boutique-card {
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px rgba(230, 57, 116, 0.05);
      display: flex;
      flex-direction: column;
    }

    .boutique-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .boutique-details {
      padding: 15px;
    }

    .boutique-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .boutique-desc {
      font-size: 0.82rem;
      color: var(--subtext);
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .boutique-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
    }

    .boutique-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
    }

    .btn-buy {
      background: linear-gradient(135deg, #e63974, #d62862);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .carousel-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 18px 18px 0 0;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.3s ease-in-out;
      width: 100%;
    }

    .carousel-slide {
      min-width: 100%;
      box-sizing: border-box;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.4);
      color: white;
      border: none;
      font-size: 14px;
      padding: 8px 11px;
      cursor: pointer;
      border-radius: 50%;
      z-index: 5;
      backdrop-filter: blur(2px);
    }

    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }

    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s, width 0.3s;
    }

    .dot.active {
      background: #ffffff;
      width: 18px;
      border-radius: 4px;
    }

    /* ACORDEÓN DE CUIDADOS */
    .accordion-header {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-dark);
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }

    .accordion-header.active {
      border-color: var(--primary);
      background-color: #fff8f9;
      color: var(--primary);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      margin-bottom: 0;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-top: none;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      margin-bottom: 12px;
      padding: 0 14px;
    }

    .accordion-content.show {
      padding: 14px;
      max-height: 1000px;
    }

    .accordion-arrow {
      font-size: 0.8rem;
      transition: transform 0.3s ease;
    }

    .accordion-header.active .accordion-arrow {
      transform: rotate(180deg);
    }

    .care-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 12px;
      background-color: #fff8f9;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid #fce8ef;
    }

    .care-item:last-child {
      margin-bottom: 0;
    }

    .care-icon {
      font-size: 1.2rem;
      line-height: 1.2;
    }

    .care-text {
      font-size: 0.85rem;
      color: var(--subtext);
      line-height: 1.4;
    }

    .care-text strong {
      color: var(--text-dark);
    }

    /* TARJETA DE FIDELIDAD */
    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 18px 0;
    }

    .stamp-slot {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px dashed var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      position: relative;
      background: #fff8f9;
      transition: all 0.3s ease;
    }

    .stamp-type {
      font-size: 0.55rem;
      color: var(--subtext);
      margin-top: 2px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stamp-slot.active {
      border: 2px solid var(--primary);
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 10px rgba(230, 57, 116, 0.3);
      font-weight: bold;
    }

    .stamp-slot.active .stamp-type {
      color: #fff;
    }

    .stamp-slot.reward {
      border-color: #d97706;
      background: #fffbe3;
      color: #b45309;
    }

    .rewards-info {
      font-size: 0.8rem;
      text-align: left;
      background: #fff8f9;
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 420px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      padding: 10px 2px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(247, 214, 224, 0.8);
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: #a08c90;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      transition: all 0.2s ease;
    }

    .nav-item .icon {
      font-size: 1.1rem;
    }

    .nav-item.active {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
